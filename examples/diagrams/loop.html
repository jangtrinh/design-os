<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform operating cycle</title>
<style>
  /*
   * Diagram role layer — the token contract from templates/diagram-scaffolds/diagram-base.html.
   *
   * Every role resolves to a project design token first. The second value in each var() is
   * the documented neutral fallback from knowledge/diagram-craft.md, used only when this
   * example is opened outside a Design OS project; the artifact declares that fallback in
   * data-token-fallback so a reader can tell "no tokens present" from "tokens ignored".
   */
  :root {
    --diagram-paper:       var(--color-background, #fbfaf8);
    --diagram-surface:     var(--color-card, #ffffff);
    --diagram-ink:         var(--color-foreground, #1a1a17);
    --diagram-muted:       var(--color-muted-foreground, #6f6f66);
    --diagram-soft:        color-mix(in oklch, var(--color-muted-foreground, #6f6f66) 65%, var(--color-background, #fbfaf8));
    --diagram-rule:        var(--color-border, #e6e3dd);
    --diagram-rule-solid:  var(--color-input, #d6d2c9);
    --diagram-accent:      var(--color-accent, #b4531f);
    --diagram-accent-tint: color-mix(in oklch, var(--color-accent, #b4531f) 12%, var(--color-background, #fbfaf8));
    --diagram-hub:         color-mix(in oklch, var(--color-foreground, #1a1a17) 90%, var(--color-background, #fbfaf8));

    --diagram-hairline: 1px;
    --diagram-gap: 24px;
  }

  :root[data-theme="dark"] {
    --diagram-paper:       var(--color-background, #14140f);
    --diagram-surface:     var(--color-card, #1c1c17);
    --diagram-ink:         var(--color-foreground, #f2efe9);
    --diagram-muted:       var(--color-muted-foreground, #a3a096);
    --diagram-soft:        color-mix(in oklch, var(--color-muted-foreground, #a3a096) 70%, var(--color-background, #14140f));
    --diagram-rule:        var(--color-border, #2e2e26);
    --diagram-rule-solid:  var(--color-input, #3d3d33);
    --diagram-accent:      var(--color-accent, #e08c4a);
    --diagram-accent-tint: color-mix(in oklch, var(--color-accent, #e08c4a) 18%, var(--color-background, #14140f));
    --diagram-hub:         color-mix(in oklch, var(--color-foreground, #f2efe9) 86%, var(--color-background, #14140f));
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --diagram-paper:       var(--color-background, #14140f);
      --diagram-surface:     var(--color-card, #1c1c17);
      --diagram-ink:         var(--color-foreground, #f2efe9);
      --diagram-muted:       var(--color-muted-foreground, #a3a096);
      --diagram-soft:        color-mix(in oklch, var(--color-muted-foreground, #a3a096) 70%, var(--color-background, #14140f));
      --diagram-rule:        var(--color-border, #2e2e26);
      --diagram-rule-solid:  var(--color-input, #3d3d33);
      --diagram-accent:      var(--color-accent, #e08c4a);
      --diagram-accent-tint: color-mix(in oklch, var(--color-accent, #e08c4a) 18%, var(--color-background, #14140f));
      --diagram-hub:         color-mix(in oklch, var(--color-foreground, #f2efe9) 86%, var(--color-background, #14140f));
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--diagram-paper);
    color: var(--diagram-ink);
    font-family: var(--font-family-body, system-ui, sans-serif);
    padding: 48px 32px;
    display: flex;
    justify-content: center;
  }

  .frame { max-width: 880px; width: 100%; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--diagram-muted);
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--font-family-display, var(--font-family-body, system-ui, sans-serif));
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: var(--diagram-gap);
  }

  .canvas { overflow-x: auto; }
  svg { width: 100%; min-width: 640px; height: auto; display: block; }

  .station { fill: var(--diagram-surface); stroke: var(--diagram-rule-solid); stroke-width: var(--diagram-hairline); }
  .station--focal { fill: var(--diagram-accent-tint); stroke: var(--diagram-accent); stroke-width: 1.5; }
  .station-name { fill: var(--diagram-ink); font-size: 14px; }
  .station-sub { fill: var(--diagram-soft); font-size: 10px; }
  .station-index { fill: var(--diagram-soft); font-size: 9px; letter-spacing: 0.16em; }

  /* The hub is the single darkest element: the inversion says "state", not "step". */
  .hub { fill: var(--diagram-hub); stroke: none; }
  .hub-name { fill: var(--diagram-paper); font-size: 14px; }
  .hub-sub { fill: var(--diagram-paper); font-size: 10px; opacity: 0.74; }

  /* Emphasis ranks: hub, focal station, solid ring, then the deliberately quiet spokes. */
  .edge { fill: none; stroke: var(--diagram-muted); stroke-width: 1.25; }
  .edge--spoke { stroke: var(--diagram-rule-solid); stroke-width: 1; stroke-dasharray: 3 5; }
  .edge-label {
    fill: var(--diagram-soft); font-size: 9px; letter-spacing: 0.16em;
    paint-order: stroke; stroke: var(--diagram-paper); stroke-width: 4px; stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop</p>
    <h1>Platform operating cycle</h1>

    <div class="canvas">
      <svg viewBox="152 92 816 676" xmlns="http://www.w3.org/2000/svg"
           role="img"
           aria-labelledby="loop-title loop-desc"
           data-diagram-owned="true"
           data-diagram-grammar="loop"
           data-reading-order="clockwise-from-top: station-0 ingest, station-1 validate, station-2 promote, station-3 publish, station-4 review, and back to station-0; the dashed write-back spokes into the hub are read second, as a set."
           data-focal-id="station-2"
           data-source-kind="brief"
           data-token-fallback="neutral">
        <title id="loop-title">Platform operating cycle</title>
        <desc id="loop-desc">A five-station operating cycle read clockwise from the top. Ingest lands source drops; Validate runs schema and personal-data checks; Promote, the focal station, is the editorial gate that moves a dataset up a storage tier; Publish serves indicators to consumers; Review collects analyst feedback and hands the cycle back to Ingest. Every station writes durable state inward along a dashed spoke into the central data catalogue, which accumulates lineage, quality history and access policy across every pass. The catalogue is state, not a further step in the cycle.</desc>

        <defs>
          <marker id="loop-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
            <path d="M 0 0 L 7 3 L 0 6 z" fill="currentColor"/>
          </marker>
        </defs>

        <!-- Ring arcs: every segment is a piece of one circle, r=288 about (560, 448), clockwise. -->
        <path class="edge" data-diagram-element="edge" id="edge-ring-0-1"
              d="M 660 180 A 288 288 0 0 1 820 324" marker-end="url(#loop-arrow)"/>
        <path class="edge" data-diagram-element="edge" id="edge-ring-1-2"
              d="M 844 396 A 288 288 0 0 1 772 644" marker-end="url(#loop-arrow)"/>
        <path class="edge" data-diagram-element="edge" id="edge-ring-2-3"
              d="M 664 716 A 288 288 0 0 1 456 716" marker-end="url(#loop-arrow)"/>
        <path class="edge" data-diagram-element="edge" id="edge-ring-3-4"
              d="M 348 644 A 288 288 0 0 1 276 396" marker-end="url(#loop-arrow)"/>
        <path class="edge" data-diagram-element="edge" id="edge-ring-4-0"
              d="M 300 324 A 288 288 0 0 1 460 176" marker-end="url(#loop-arrow)"/>

        <!-- Write-back spokes: true radii, dashed, stopping a marker gap short of the hub. -->
        <line class="edge edge--spoke" data-diagram-element="edge" id="edge-spoke-0"
              x1="560" y1="204" x2="560" y2="344" marker-end="url(#loop-arrow)"/>
        <line class="edge edge--spoke" data-diagram-element="edge" id="edge-spoke-1"
              x1="728" y1="392" x2="660" y2="416" marker-end="url(#loop-arrow)"/>
        <line class="edge edge--spoke" data-diagram-element="edge" id="edge-spoke-2"
              x1="700" y1="640" x2="620" y2="532" marker-end="url(#loop-arrow)"/>
        <line class="edge edge--spoke" data-diagram-element="edge" id="edge-spoke-3"
              x1="420" y1="640" x2="500" y2="532" marker-end="url(#loop-arrow)"/>
        <line class="edge edge--spoke" data-diagram-element="edge" id="edge-spoke-4"
              x1="392" y1="392" x2="460" y2="416" marker-end="url(#loop-arrow)"/>

        <text class="edge-label" x="572" y="288">LINEAGE</text>
        <text class="edge-label" x="644" y="596" text-anchor="end">TIER RULE</text>

        <!-- Hub: exactly one, at the center, holding accumulated state. -->
        <g data-diagram-element="node" id="hub">
          <circle class="hub" cx="560" cy="448" r="88"/>
          <text class="hub-name" x="560" y="442" text-anchor="middle">Data catalogue</text>
          <text class="hub-sub" x="560" y="464" text-anchor="middle">lineage · quality · policy</text>
        </g>

        <!-- Stations, clockwise from the top. -->
        <g data-diagram-element="node" id="station-0">
          <rect class="station" x="460" y="124" width="200" height="72" rx="4"/>
          <text class="station-index" x="560" y="148" text-anchor="middle">01</text>
          <text class="station-name" x="560" y="168" text-anchor="middle">Ingest</text>
          <text class="station-sub" x="560" y="184" text-anchor="middle">land source drops</text>
        </g>
        <g data-diagram-element="node" id="station-1">
          <rect class="station" x="736" y="324" width="200" height="72" rx="4"/>
          <text class="station-index" x="836" y="348" text-anchor="middle">02</text>
          <text class="station-name" x="836" y="368" text-anchor="middle">Validate</text>
          <text class="station-sub" x="836" y="384" text-anchor="middle">schema · personal-data checks</text>
        </g>
        <g data-diagram-element="node" id="station-2">
          <rect class="station station--focal" x="628" y="644" width="200" height="72" rx="4"/>
          <text class="station-index" x="728" y="668" text-anchor="middle">03</text>
          <text class="station-name" x="728" y="688" text-anchor="middle">Promote</text>
          <text class="station-sub" x="728" y="704" text-anchor="middle">the editorial tier gate</text>
        </g>
        <g data-diagram-element="node" id="station-3">
          <rect class="station" x="292" y="644" width="200" height="72" rx="4"/>
          <text class="station-index" x="392" y="668" text-anchor="middle">04</text>
          <text class="station-name" x="392" y="688" text-anchor="middle">Publish</text>
          <text class="station-sub" x="392" y="704" text-anchor="middle">serve indicators</text>
        </g>
        <g data-diagram-element="node" id="station-4">
          <rect class="station" x="184" y="324" width="200" height="72" rx="4"/>
          <text class="station-index" x="284" y="348" text-anchor="middle">05</text>
          <text class="station-name" x="284" y="368" text-anchor="middle">Review</text>
          <text class="station-sub" x="284" y="384" text-anchor="middle">analyst feedback</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
