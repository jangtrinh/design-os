name: TocChienDictionary
options:
  bundleIdPrefix: com.tocchien.pilot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TocChienDictionary:
    type: application
    platform: iOS
    sources:
      - path: TocChienDictionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tocchien.pilot.dictionary-search
        PRODUCT_NAME: TocChienDictionary
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TocChien Dictionary
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  TocChienDictionaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TocChienDictionaryTests
    dependencies:
      - target: TocChienDictionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tocchien.pilot.dictionary-search.tests
        GENERATE_INFOPLIST_FILE: YES
  TocChienDictionaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TocChienDictionaryUITests
    dependencies:
      - target: TocChienDictionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tocchien.pilot.dictionary-search.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TocChienDictionary:
    build:
      targets:
        TocChienDictionary: all
    test:
      targets:
        - TocChienDictionaryTests
        - TocChienDictionaryUITests
