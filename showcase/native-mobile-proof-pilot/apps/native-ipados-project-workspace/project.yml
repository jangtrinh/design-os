name: ProjectBriefWorkspace
options:
  bundleIdPrefix: com.designos.proofpilot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
targets:
  ProjectBriefWorkspace:
    type: application
    platform: iOS
    sources:
      - path: Sources/ProjectBriefWorkspace
    info:
      path: Sources/ProjectBriefWorkspace/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designos.proofpilot.projectbriefworkspace
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Project Brief Workspace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  ProjectBriefWorkspaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ProjectBriefWorkspaceTests
    dependencies:
      - target: ProjectBriefWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designos.proofpilot.projectbriefworkspace.tests
        GENERATE_INFOPLIST_FILE: YES
  ProjectBriefWorkspaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ProjectBriefWorkspaceUITests
    dependencies:
      - target: ProjectBriefWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designos.proofpilot.projectbriefworkspace.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ProjectBriefWorkspace:
    build:
      targets:
        ProjectBriefWorkspace: all
        ProjectBriefWorkspaceTests: [test]
        ProjectBriefWorkspaceUITests: [test]
    test:
      targets:
        - ProjectBriefWorkspaceTests
        - ProjectBriefWorkspaceUITests
