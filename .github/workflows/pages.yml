name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify entry point
        run: test -f site/index.html

      # The example gallery is derived from the committed corpus rather than duplicated
      # into site/, so the artifacts have exactly one source of truth in the repo.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the examples gallery
        run: node scripts/build-examples-gallery.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
