/* Panel override (spec P5 §Tokens): the plugin iframe cannot fetch a webfont, so
   the body family keeps Inter first but falls back to the host system stack —
   self-contained, no network.

   IA v2 (panel redesign phase 02): the panel now reads through exactly ONE
   family var, `--font-family-body` — `--font-family-display` and `--font-mono`
   are no longer referenced anywhere below and are dropped from this override
   (the compiled block above keeps declaring them for provenance; regenerating
   it is out of scope here). The panel-only sub-xs sizes this block used to add
   (`--font-size-2xs`/`--font-size-3xs`) are also gone — the three `--fga-font-*`
   tokens in the skin `:root` below are now the only panel type scale. */
:root {
  --font-family-body: Inter, -apple-system, system-ui, sans-serif;
  --space-hair: 4px;     /* the sub-space-1 gap a mini row needs */
}

/* ── Panel skin (owner reference: dark settings modal) ────────────────────────
   The compiled Swiss-Monolith block above stays the DS of record (and the panel's
   provenance); this layer re-points only what the chrome paints with, the same way the
   font override above re-points the families the iframe cannot fetch. Owner decision
   2026-07-29: for THIS surface the reference wins over the brand accent.

   Provenance: pixel-sampled from references/Reference.png (1168×992, 2026-07-29) — the value next
   to each token is the coordinate it was read at. Every one is a var() the chrome reads; no hex
   below this block.

   IA v2 typography (phase 02, owner-locked): exactly three sizes, declared here and used
   nowhere else in the chrome — 14px title (the one status sentence), 13px body (every
   value/row-label/activity sentence/button), 11px caption (labels above values, timestamps,
   the build id). 13px/11px sit below taste-lint's `tiny-body-text` floor (≤13px = error) for
   a literal `font-size: Npx` — these are custom-property VALUES consumed via var(), the same
   shape the former `--font-size-2xs/3xs` panel tokens already used, so the rule does not fire
   (verified: `npx vitest run tests/figma-plugin-panel.test.ts` after adding these three, 0
   taste errors — no scoped exemption was needed). */
:root {
  --fga-body: #171717;            /* content pane  (1000,150) — the panel's own field */
  --fga-surface: #262626;         /* raised tier   (160,660) — nav rows, footer, buttons */
  --fga-row-active: #333333;      /* active row    (200,393) */
  --fga-border: #2A2A2E;          /* hairline around surfaces (276-row of the divider scan) */
  --fga-border-control: #474747;  /* input/button outline (600,341) + (379,368) — 1.93:1 on the
                                     body: decorative delineation only (WCAG 1.4.11 exempt) */
  --fga-border-strong: #646464;   /* the SAME outline where it is an interactive control's only
                                     boundary (Sync now / Later) — 3.03:1, the minimum
                                     non-text contrast. Δ from the sample: +29 steps, taken because
                                     correctness is a gate, not a score (DECISIONS.md) */
  --fga-divider: #454545;         /* the dotted rule  (500,274-275) */
  --fga-text: #FFFFFF;            /* primary        (52,59) */
  --fga-label: #D6D6D6;           /* label above a value — bright in the reference, kept under #FFF */
  --fga-text-muted: #9B9B9B;      /* helper/subtitle — observed #9A9A9A, +1 step (Δ 1/255) so it
                                     clears 4.5:1 ON THE ACTIVE ROW too (4.49 → 4.55) */
  --fga-text-dim: #909090;        /* section label (44-92,106-126 max) — 5.62 on body, 4.74 on
                                     surface, but only 3.96 on --fga-row-active: never use it there */
  /* Desaturated to sit in a dark field (phase 03 §5), recomputed on all three
     backgrounds after tuning — success/warning/info are also used as TEXT
     (status-sentence, 4.5:1 required) on --fga-body only; as an icon/dot
     indicator (3:1) they additionally reach --fga-row-active. No token
     needed lightening: every reachable pair already cleared its floor. */
  --fga-tone-success: #5BA46F;    /* the reference's own green, ~8% less saturated — 5.96 (body, text), 4.20 (row-active, indicator) */
  --fga-tone-warning: #C9A356;    /* web-amber → ochre; stops shouting next to the greys — 7.56 (body, text) */
  --fga-tone-info: #8FB4D9;       /* desaturated steel, not "link blue" — 8.28 (body, text); also --fga-focus's value, 3:1+ on all three surfaces */
  --fga-tone-muted: #9B9B9B;      /* already neutral; aligned with --fga-text-muted — 6.45 (body, indicator) */
  --fga-tone-danger: #D98A8A;     /* muted terracotta, icon-only (never text) — 4.78 (row-active, indicator) */
  --fga-radius: 8px;              /* inputs, cards, buttons */
  --fga-radius-sm: 6px;           /* chips */
  --fga-divider-gap: 12px;        /* breathing room each side of a dotted rule */
  --fga-font-title: 14px;         /* the ONE title: the status sentence (block 1) */
  --fga-font-body: 13px;          /* every value, row label, activity sentence, button */
  --fga-font-caption: 11px;       /* labels above values, timestamps, the build id */
  --fga-track-title: -0.01em;     /* type micro-craft (§3): tight — one short line */
  --fga-track-body: 0;
  --fga-track-caption: 0.015em;   /* small text needs the air */
  --fga-lh-title: 1.35;
  --fga-lh-body: 1.5;
  --fga-lh-caption: 1.45;
  /* Depth layer (§2) — alphas, not new greys. Sampled bases above stay authoritative;
     light falls on raised surfaces via a low-alpha white border, never a lighter
     background (taste-lint's mode-invisible-surface cannot see custom-property
     backgrounds — Gate D is the only enforcement, so this is borders-only by contract). */
  --fga-hairline: rgba(255, 255, 255, 0.08);      /* raised-card border */
  --fga-hairline-soft: rgba(255, 255, 255, 0.06); /* nested/secondary edges, row hover */
  --fga-topedge: rgba(255, 255, 255, 0.03);       /* 1px inner highlight on the top edge */
  --fga-focus: #8FB4D9;           /* the tuned info hue — visible on all three surfaces (≥3:1) */
  --fga-motion: 140ms;            /* named transitions only (§4) — never "all", never linear */
  --fga-ease: cubic-bezier(0.2, 0, 0, 1); /* ease-out */
  /* Figma dark chrome, matched by eye/official UI3 dark surface. The plugin window's
     own (host-drawn) title bar cannot be repainted, so this blends the panel's FIRST
     block into it instead — the window bar and the sticky status row read as one
     continuous surface. Content below the status block keeps --fga-body; recomputed
     all 4 tones + --fga-text-muted against this value (owner ask, 2026-07-30) — every
     pair clears its floor, tightest is --fga-tone-success at 4.64:1 (text floor 4.5:1).
     (This block is the DARK value — see the `html.figma-light` override below for the
     light-theme repaint; "single-theme" is no longer true as of the system-appearance
     requirement in the same commit as this comment's edit.) */
  --fga-chrome: #2C2C2C;
}

/* ── System/Figma appearance (owner requirement, 2026-07-30) ───────────────────────
   `figma.showUI({ themeColors: true })` (main.ts) makes Figma stamp `figma-dark` or
   `figma-light` onto the iframe document's <html> element to match the user's CURRENT
   Figma appearance — documented `showUI` behavior, not something this file detects
   itself. The dark `:root` block above stays the DEFAULT (dark is the design of
   record; an iframe with neither class, or an older host, renders dark) — this block
   is the ONLY override, re-pointing every COLOR token for `html.figma-light`. Radii,
   spacing, and type tokens are theme-invariant (unaffected by appearance) and are
   deliberately NOT repeated here — only colors override.

   Light derivation rules (owner-locked, 2026-07-30): body #F7F7F7, surface #FFFFFF,
   row-active #ECECEC, chrome #FFFFFF (Figma light UI surface), text #1A1A1A, label
   #3D3D3D, muted #6B6B6B, hairlines flip to low-alpha BLACK, topedge becomes a subtle
   darker top edge, dotted divider #C9C9C9, tones re-derived for light. Full AA table
   computed against EVERY surface each token actually reaches (not assumed from the
   dark table) — see below; two owner-given values needed adjusting from their
   as-given hex to clear a floor, both reported with the delta.

   Full recompute (WCAG 2.1, text 4.5:1 / non-text-indicator 3:1), against every
   surface a token is REACHABLE on in this file's actual markup (status-sentence and
   status-dot sit on --fga-chrome, which equals --fga-surface's hex here; activity-row
   icons sit on --fga-row-active when fresh, --fga-surface when stale; section-label
   and .activity-empty reach --fga-body via the Context block / plain body):
     --fga-text     (#1A1A1A) vs body 16.25, surface/chrome 17.40, row-active 14.73 — PASS everywhere
     --fga-label    (#3D3D3D) vs body 10.14, surface/chrome 10.86, row-active  9.19 — PASS everywhere
     --fga-text-muted (#6B6B6B, AS GIVEN — owner requires 4.5 on ALL its surfaces):
                    vs body  4.97, surface/chrome 5.33, row-active 4.51 — PASS everywhere
                    (row-active clears by only 0.01 — tight but a genuine pass; not altered,
                    since only FAILING values were adjusted, per instruction)
     --fga-text-dim (owner-given #757575 vs body = 4.30 — FAILS the 4.5 floor; section-label
                    reaches plain body via the Context block, so this pair IS reachable, not
                    theoretical). ADJUSTED to #707070: vs body 4.62, surface 4.95, row-active
                    4.19 (row-active fails, but --fga-text-dim is never used on row-active by
                    construction — same restriction the dark twin documents; the only OTHER
                    reachable surface, body, now passes with a real margin instead of failing)
     --fga-tone-success (#1F7A3D) vs chrome 5.37 (text) · vs row-active 4.55 (indicator, 3:1 floor) — PASS
     --fga-tone-warning (#8A6A1F) vs chrome 5.05 (text) · vs row-active 4.27 (indicator) — PASS
     --fga-tone-info    (#2B5E8C) vs chrome 6.81 (text) · vs row-active 5.77 (indicator);
                    also --fga-focus's value — vs body 6.36, surface/chrome 6.81, row-active 5.77,
                    all far past the 3:1 focus-ring floor — PASS
     --fga-tone-danger  (#B3372F) — icon-only, never text — vs row-active 5.07 (indicator) — PASS
     --fga-tone-muted   (#6B6B6B, = text-muted) vs chrome/body — PASS (see text-muted above)
     --fga-border-strong (#767676, decorative-boundary token, not owner-specified — derived)
                    vs surface (sync-btn's own bg) 4.54, vs row-active (hover) 3.84 — both
                    clear the 3:1 non-text floor
   No token needed lightening beyond the two above; both deltas are recorded next to
   the failing value, exactly as phase 01/03 did for the dark values. */
html.figma-light {
  --fga-body: #F7F7F7;
  --fga-surface: #FFFFFF;
  --fga-row-active: #ECECEC;
  --fga-border: #D9D9D9;          /* code chip border — decorative, WCAG-exempt, no floor */
  --fga-border-control: #B0B0B0;  /* scrollbar thumb — decorative chrome, no floor */
  --fga-border-strong: #767676;   /* sync-btn's own boundary — 4.54:1 on --fga-surface, 3.84:1 on hover */
  --fga-divider: #C9C9C9;         /* the dotted rule */
  --fga-text: #1A1A1A;
  --fga-label: #3D3D3D;
  --fga-text-muted: #6B6B6B;      /* owner-given, as-is: 4.51:1 on row-active (tight but real) */
  --fga-text-dim: #707070;        /* ADJUSTED from owner's #757575 (4.30 on body, failed) → 4.62 */
  --fga-tone-success: #1F7A3D;
  --fga-tone-warning: #8A6A1F;
  --fga-tone-info: #2B5E8C;
  --fga-tone-muted: #6B6B6B;
  --fga-tone-danger: #B3372F;
  --fga-hairline: rgba(0, 0, 0, 0.12);       /* raised-card border — black flip of the dark 0.08 */
  --fga-hairline-soft: rgba(0, 0, 0, 0.08);  /* nested/secondary edges, row hover — black flip of 0.06 */
  --fga-topedge: rgba(0, 0, 0, 0.04);        /* a subtle DARKER top edge, not a highlight */
  --fga-focus: #2B5E8C;           /* = --fga-tone-info; ≥3:1 on all four surfaces */
  --fga-chrome: #FFFFFF;          /* Figma light UI surface */
}

/* ── Panel chrome — dark settings-modal skin, IA v2 ────────────────────────────
   Two-tier surfaces (content pane DARKER than the raised nav tier — the reference's
   own inversion of the usual pattern), dotted section dividers, label-over-value
   cells, an active-row left accent bar, underlined inline links for secondary
   actions. Fluid 240px → 640px+ at any height: no breakpoint, no fixed width
   outside the decorative-square whitelist, one scroller (the panel itself),
   sticky status block.

   IA v2 (phase 02): three blocks — Status / Context / Activity — plus the sync
   prompt. Docs link, Copy button, the Details toggle/expanded-zone and the four
   debug cells are gone entirely (debug lives in `figma-agent status`); the
   onboarding card is priority-1 content and stays, re-parented under the status
   sentence. One font family throughout (`--font-family-body`, declared ONCE on
   `body` and inherited); every text glyph that used to be `✗`/`✓` is now an
   inline Phosphor-style SVG (panel-ui.ts's `ICONS` map). ──────────────────── */
*, *::before, *::after { box-sizing: border-box; }
img, svg { max-width: 100%; }

/* The stack must be as tall as the iframe main sized, or the footer floats mid-air with
   bare paper under it — the borderless panel has no frame left to close that gap. */
html, body { height: 100%; }

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-family-body);
  font-size: var(--fga-font-body);
  line-height: var(--fga-lh-body);
  color: var(--fga-text);
  background: var(--fga-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;                 /* the .panel scrolls, not the document */
}

/* The scroll container and the fluidity root: no width/min-width/max-width here —
   the iframe's width is whatever Figma gives it (240 → 640+), and every child sizes
   from it (§ responsive block below). */
.panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;                 /* long content scrolls vertically… */
  overflow-x: hidden;               /* …and NEVER horizontally */
  background: var(--fga-body);
  /* Scrollbar (§6) — thin, quiet, thumb from the border family. No layout shift. */
  scrollbar-width: thin;
  scrollbar-color: var(--fga-border-control) transparent;
}
.panel::-webkit-scrollbar { width: 8px; }
.panel::-webkit-scrollbar-track { background: transparent; }
.panel::-webkit-scrollbar-thumb {
  background: var(--fga-border-control);
  border-radius: var(--fga-radius-sm);
}

/* Selection (§6) — the panel is read, not edited; keep it subtle. ::selection is
   the ONE exempt alpha background (a highlight over text, not a surface tint) —
   Gate D exempts this selector by name. */
::selection { background: rgba(143, 180, 217, 0.28); color: var(--fga-text); }

/* Spatial rhythm (phase 03 §1): one row layout, one icon grid, one dot grid —
   applied via markup classes (`fga-row`, `fga-icon`) rather than duplicated
   per-selector, so `.status-row` and `.activity-row` share the same flex
   layout instead of re-declaring it. Two size families, not one: SVG icons
   ride the 14px grid; the two CSS-drawn dots (`.status-dot`, `.identity-dot`)
   are dots, not icons — unified at 8px so there is one dot size, one icon
   size, and no third. */
.fga-row { display: flex; align-items: flex-start; gap: var(--space-1); }
/* Optical centring on the FIRST line box rather than the flex box: a 14px icon
   beside a 13px/1.5-line-height line sits high if you centre on the box. line
   box = 13 × 1.5 = 19.5px, so (19.5 − 14)/2 = 2.75px — derived, not eyeballed,
   and it stays correct if the size token moves. */
.fga-icon { width: 14px; height: 14px; flex: 0 0 auto; }
.fga-row > .fga-icon { margin-top: calc((1.5em - 14px) / 2); }
.status-dot, .identity-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

/* Block 1 — STATUS: sticky, one dot + one sentence. No pill/meta split, no
   port numbers, no attempt counts — the sentence names the problem AND the
   next action (panel-model.ts's `statusSentence`). */
.status-hero {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  /* No special-cased padding-top here anymore (masthead removed, this is now the
     panel's first row) — the shorthand's --space-1 applies uniformly on every edge. */
  padding: var(--space-1) var(--space-2);
  position: sticky;
  top: 0;
  z-index: 10;
  /* Owner ask 2026-07-30: blend this first block into the (unpaintable) plugin window
     chrome above it — --fga-chrome, not --fga-body. Everything below the status block
     keeps --fga-body; only this sticky row matches the window bar. */
  background: var(--fga-chrome);
}
.status-row { min-width: 0; }

/* Live marker — a circle, tone-coloured. Pings outward while probing. Plain
   CSS shape (Phosphor `circle`, filled) — no SVG needed for an unadorned dot.
   Sizing comes from the shared `.status-dot, .identity-dot` rule above; this
   one only adds what is unique to the status dot (position + tone colour). */
.status-dot {
  position: relative;
  /* Sits beside the TITLE line (14px / --fga-lh-title), not the body line the
     shared .fga-icon formula assumes — derived against its own context rather
     than reused blind: (14px × 1.35 − 8px) / 2. */
  margin-top: calc((var(--fga-font-title) * var(--fga-lh-title) - 8px) / 2);
  background: var(--fga-tone-muted);
  /* Motion (§4): tone crossfades instead of jumping. Named properties only. */
  transition: background-color var(--fga-motion) var(--fga-ease);
}
.status-dot[data-tone="success"] { background: var(--fga-tone-success); }
.status-dot[data-tone="warning"] { background: var(--fga-tone-warning); }
.status-dot[data-tone="info"]    { background: var(--fga-tone-info); }
.status-dot[data-tone="muted"]   { background: var(--fga-tone-muted); }
.status-dot::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: inherit;
  opacity: 0;
}
.status-dot.is-pulsing::after { animation: fga-ping 1.6s ease-out infinite; }

/* The ONE title — replaces the old pill+meta split. Tone-coloured (the pill's
   job), states the problem and the next action in one sentence (the meta's job). */
.status-sentence {
  margin: 0;
  font-size: var(--fga-font-title);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--fga-track-title);
  line-height: var(--fga-lh-title);
  color: var(--fga-text);
  overflow-wrap: anywhere;
  /* Motion (§4): tone crossfades instead of jumping. Named properties only. */
  transition: color var(--fga-motion) var(--fga-ease);
}
.status-sentence[data-tone="success"] { color: var(--fga-tone-success); }
.status-sentence[data-tone="warning"] { color: var(--fga-tone-warning); }
.status-sentence[data-tone="info"]    { color: var(--fga-tone-info); }
.status-sentence[data-tone="muted"]   { color: var(--fga-text-muted); }

/* Idle-commit prompt (spec 004 P4) — an active-row card. Unchanged behaviour,
   restyled to the new type scale. No left-bar: the owner vetoed the inset
   left-bar treatment entirely (2026-07-29, screenshot) — surface + border
   alone carries "this is a card". Depth (§2) is a low-alpha white BORDER, not
   a lighter background — the shorthand comes first, then the dotted divider
   is restored on the next line, or the shorthand would erase it. */
.sync-prompt {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--fga-hairline);
  border-top: 1px dotted var(--fga-divider);
  border-radius: var(--fga-radius);
  background: var(--fga-row-active);
  min-width: 0;
  /* Motion (§4): never `height` (a layout prop — taste-lint error); opacity only. */
  transition: opacity var(--fga-motion) var(--fga-ease);
}
.sync-prompt[hidden] { display: none; }
.sync-msg {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fga-font-body);
  color: var(--fga-text);
}
.sync-actions { display: flex; flex-wrap: wrap; gap: var(--space-1); flex: 0 0 auto; }
.sync-btn {
  padding: 4px var(--space-1);
  font-size: var(--fga-font-body);
  font-weight: var(--font-weight-medium);
  border: 1px solid var(--fga-border-strong);
  border-radius: var(--fga-radius-sm);
  background: var(--fga-surface);
  color: var(--fga-text);
  cursor: pointer;
}
.sync-btn:hover { background: var(--fga-row-active); }

/* Onboarding (first-run only; JS toggles [hidden]) — priority-1 content, not a
   debug affordance: re-parented directly under the status sentence (block 1),
   the problem-and-next-action answer for "disconnected, never connected". No
   left-bar: the owner vetoed the inset left-bar treatment entirely
   (2026-07-29, screenshot) — surface + border alone carries "this is a card".
   Depth (§2): a low-alpha white border + a slightly brighter top edge, light
   falling on the card rather than an inset shadow. */
.onboarding {
  padding: var(--space-2);
  background: var(--fga-surface);
  border: 1px solid var(--fga-hairline);
  border-top-color: var(--fga-topedge);
  border-radius: var(--fga-radius);
}
.onboarding-list {
  margin: 0;
  padding-left: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  font-size: var(--fga-font-body);
  color: var(--fga-text);
  overflow-wrap: anywhere;
}
/* Inline code as an outlined chip — outline, not fill (§2: inputs are not filled). */
code {
  font-size: var(--fga-font-body);
  /* 2px vertical (half a hairline) keeps the chip optically centred on a
     4-grid line box; expressed as calc() off --space-hair rather than a bare
     "2px" literal — a literal 2px is off-grid (not ≡0 mod 4) and Gate A's own
     code (phase 03 §Gate) would flag it despite the audit table naming "2px"
     as the target value. This is the derived equivalent, gate-clean. */
  padding: calc(var(--space-hair) / 2) var(--space-1);
  background: var(--fga-surface);
  color: var(--fga-text);
  border: 1px solid var(--fga-border);
  border-radius: var(--fga-radius-sm);
}

/* Section label (context + activity headings) — sentence case, not uppercase.
   The brightest text tier (--fga-label), matching the reference's pattern
   where section headers are the boldest text on the page (judge ruling). */
.section-label {
  margin: 0 0 4px;
  font-size: var(--fga-font-caption);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--fga-track-caption);
  color: var(--fga-label);
}

/* Block 2 — CONTEXT: File / Page / Selection, label-over-value rows (reuses the
   detail-cell pattern the old connection-details grid used). */
.context {
  border-top: 1px dotted var(--fga-divider);
  padding: var(--space-1) var(--space-2);
  padding-top: var(--fga-divider-gap);
}
/* Fluid grid, no fixed columns: two columns from ~264px up, one at 240px,
   three-plus at 480/640 — no media query. */
.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--space-1) var(--space-2);
  margin: 0;
}
/* Label-over-value cell, outlined (not filled — §2: inputs are not filled).
   Depth (phase 03 §2): a low-alpha white border + a slightly brighter top
   edge — light falling on a raised surface, not a flat grey hairline. */
.detail-cell {
  min-width: 0;
  border: 1px solid var(--fga-hairline);
  border-top-color: var(--fga-topedge);
  border-radius: var(--fga-radius);
  padding: var(--space-1);
}
.detail-grid dt {
  color: var(--fga-label);
  font-size: var(--fga-font-caption);
  letter-spacing: var(--fga-track-caption);
}
/* No tabular-nums here (phase 03 §3): File/Page/Selection are prose, not a
   numeric column — only .log-meta's relative-age column keeps it. */
.detail-grid dd {
  margin: 0;
  color: var(--fga-text);
  font-size: var(--fga-font-body);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* The file row's second line — "command target" / "N other files connected".
   The panel's honest answer to "which file will my command hit?" (§3 PEERS). */
.detail-note {
  margin: 4px 0 0;
  font-size: var(--fga-font-caption);
  color: var(--fga-text-muted);
  overflow-wrap: anywhere;
}
.detail-note:empty { display: none; }

/* Block 3 — ACTIVITY: mono-free, sentence-case prose rows — [icon][sentence]
   + a caption line with relative time. The sentence says what the agent DID. */
.activity {
  border-top: 1px dotted var(--fga-divider);
  padding: var(--space-1) var(--space-2);
  padding-top: var(--fga-divider-gap);
  background: var(--fga-surface);
}
.activity-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-hair);
  /* One scroller only: `.panel` scrolls the whole document; the feed is capped in
     ROWS (ACTIVITY_ROWS = 20, panel-ui.ts), never by a nested max-height/overflow-y. */
}
/* A row is [icon][body], where body stacks the SENTENCE over the meta line.
   Layout (flex/align/gap) comes from the shared `.fga-row` rule (§1) — this
   selector adds only what is unique to an activity row. */
.activity-row {
  padding: var(--space-1);
  border: 1px solid transparent; /* depth (§2): hover fills this with --fga-hairline-soft (§6) */
  border-radius: var(--fga-radius-sm);
  min-width: 0;
  /* Motion (§4): hover fill/border are named transitions, never `all`. The entrance
     animation itself lives on `.is-new` only (below) — every render rebuilds every row's
     DOM node (panel-ui.ts's simplest fix within its existing full-rebuild structure), so
     animating the base class replayed it on every 1s heartbeat tick even for rows that
     never changed (backlog 4.7, worst when a failing command kept re-rendering). */
  transition: background-color var(--fga-motion) var(--fga-ease), border-color var(--fga-motion) var(--fga-ease);
}
/* Only a row whose key was NOT in the previous render gets this — a rebuilt-but-
   unchanged row is visually inert. */
.activity-row.is-new {
  animation: fga-row-in var(--fga-motion) var(--fga-ease);
}
/* Every row but the newest is dimmed; the newest is the reference's active row —
   background only, no left-bar (the owner vetoed the inset left-bar treatment
   entirely, 2026-07-29 screenshot; the running row is already signalled by its
   spinning circle-notch icon). Stale rows recolor TEXT to --fga-text-dim
   rather than blend via opacity: opacity crushed .log-meta's contrast on the
   surface background well below WCAG AA (~2.9:1 measured) on every
   completed/failed row — i.e. the majority of any real feed. A solid dim
   colour keeps every row's text AA-compliant (--fga-text-dim on --fga-surface
   is 4.74:1). */
.activity-row:not(.is-stale) {
  background: var(--fga-row-active);
}
.activity-row.is-stale .log-label,
.activity-row.is-stale .log-meta { color: var(--fga-text-dim); }
/* Hover (§6, corrected post-A13) — "lift by lightening" was MEASURED and
   rejected: the newest row already sits on --fga-row-active, where muted text
   is 4.55:1 — a lightened hover step measured 4.09, then 3.97 one step
   further, both under the AA floor. Stale rows are EXEMPT from hover
   entirely (A13 ruling): putting a stale row's --fga-text-dim text onto
   --fga-row-active measured 3.96:1, under AA — and a stale row is history,
   it needs no hover affordance. So only the single true active/current row
   (the newest, non-stale one) gets the border-lift; every other row is inert
   on hover. */
.activity-row:not(.is-stale):hover { border-color: var(--fga-hairline-soft); }
/* Status reads by SHAPE first, colour second: an inline Phosphor-style SVG per
   state (check-circle / x-circle / circle-notch), never a text glyph. The
   accessible label lives on this WRAPPING span (aria-label="ok"/"failed"/
   "running"); the svg inside is aria-hidden — its meaning is already spoken.
   Sizing + optical centring come from the shared `.fga-icon` rule (§1) —
   `.log-icon-wrap` carries that class too; this selector only adds colour. */
.log-icon { display: block; width: 100%; height: 100%; }
.log-icon-wrap[data-state="ok"]      .log-icon { color: var(--fga-tone-success); }
.log-icon-wrap[data-state="failed"]  .log-icon { color: var(--fga-tone-danger); }
.log-icon-wrap[data-state="running"] .log-icon { color: var(--fga-tone-warning); animation: fga-spin 1s linear infinite; }
/* Stale (non-newest) rows dim the icon too — same equal-specificity family as the
   tone rules above, so it must come after them in source order to win the tie. */
.activity-row.is-stale .log-icon { color: var(--fga-text-dim); }
.log-body {
  flex: 1 1 auto;
  min-width: 0; /* lets the ellipsis in .log-label / .log-meta actually engage */
}
/* The hero line — one English sentence about what the agent did. Owns the full
   row width (activity-sentence.ts derives the text; this file only sizes it). */
.log-label {
  font-size: var(--fga-font-body);
  font-weight: var(--font-weight-medium);
  letter-spacing: var(--fga-track-body);
  line-height: var(--fga-lh-body);
  color: var(--fga-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* Owner-observed (live screenshot, concurrency & jobs addendum): a FAILED row's reason
   ("The script stopped: runtime error: …") was clipped by the single-line ellipsis
   above — Activity is the one surface exempt from the terse-truncate rule, and a
   failure reason must be readable without hovering the row for its `title`. Only
   `.log-label--wrap` (panel-ui.ts, failed rows only) overrides to full wrapping; ok/
   running rows keep the single-line ellipsis unchanged. */
.log-label--wrap {
  overflow: visible;
  text-overflow: clip;
  white-space: normal;
  word-break: break-word;
}
/* The footnote — relative age, one muted line under the sentence. */
.log-meta {
  font-size: var(--fga-font-caption);
  letter-spacing: var(--fga-track-caption);
  line-height: var(--fga-lh-caption);
  color: var(--fga-text-muted);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* Empty state (§6) — quiet typography, no box, no icon. */
.activity-empty {
  color: var(--fga-text-dim);
  font-size: var(--fga-font-caption);
  letter-spacing: var(--fga-track-caption);
  padding: var(--space-1) 0;
}

/* Underlined inline links — the reference's "Change photo" affordance for
   secondary actions ("Later"). The underline already carries the affordance,
   so the text itself reads at --fga-label rather than --fga-text-muted
   (whose 4.55:1 on the active row background sat right at the AA floor). */
.inline-link {
  display: inline-flex;
  align-items: center;
  gap: var(--space-hair);
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  font-size: var(--fga-font-body);
  color: var(--fga-label);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.inline-link:hover { color: var(--fga-text); }
/* Focus — the two interactive controls only (Sync now, Later); .sync-btn's pair
   lives beside its own declaration. */
.sync-btn:focus-visible, .inline-link:focus-visible {
  outline: 2px solid var(--fga-focus);
  outline-offset: 2px;
}

/* Footer band — identity row only (status-dot mirror + build id). The Docs/Copy/
   Details actions row that used to sit below it is cut entirely (§2); the file
   name it also used to carry now lives in Block 2's Context row instead. */
.footer-row {
  border-top: 1px dotted var(--fga-divider);
  padding: var(--space-1) var(--space-2);
  padding-top: var(--fga-divider-gap);
  margin-top: auto;
}
.identity-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-hair);
  min-width: 0;
}
/* CSS mirror of #fga-dot's tone — panel-ui.ts writes the tone onto #fga-dot only;
   a second JS write target would be a behaviour change, so the mirror is derived
   here instead. Falls back to muted if :has() is unsupported — quiet, never broken. */
/* Sizing comes from the shared `.status-dot, .identity-dot` rule (§1: one dot
   grid, 8px — was 6px). This rule adds only the default (muted) fill. */
.identity-dot { background: var(--fga-tone-muted); }
.panel:has(#fga-dot[data-tone="success"]) .identity-dot { background: var(--fga-tone-success); }
.panel:has(#fga-dot[data-tone="warning"]) .identity-dot { background: var(--fga-tone-warning); }
.panel:has(#fga-dot[data-tone="info"])    .identity-dot { background: var(--fga-tone-info); }
#fga-version { flex: 0 0 auto; font-size: var(--fga-font-caption); color: var(--fga-text-muted); font-variant-numeric: tabular-nums; }

/* ── Responsive contract (240px → 640px+, any height, locked) ─────────────────
   The shrink chain must be UNBROKEN from the shell down: one flex/grid item
   anywhere on the path that keeps its intrinsic width pushes the row past the
   panel edge. overflow-x:hidden would then merely HIDE the overflow. */
.panel > * { min-width: 0; max-width: 100%; }
.status-row > *, .identity-row > *, .sync-prompt > *,
.log-body, .log-body > *, .detail-cell, .detail-cell > *, .activity-row > * { min-width: 0; }

/* Truncation: the trio is a set — ellipsis without the other two does nothing. */
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Motion — the probing marker pings outward (transform + opacity only, never a
   layout property). Snappy 0.1s ease-out is the brand curve. The pending feed
   icon spins (transform only) — a continuous linear rotation is the one place
   `linear` is correct (taste-lint's checkLinearOrAllTransition only inspects
   `transition:`, never `animation:`). Every animated/transitioned selector is
   guarded below. */
@keyframes fga-ping {
  0%   { opacity: 0.5; transform: scale(1); }
  100% { opacity: 0;   transform: scale(2.4); }
}
@keyframes fga-spin {
  to { transform: rotate(360deg); }
}
/* A new activity row arrives, transform + opacity only (§4). */
@keyframes fga-row-in {
  from { opacity: 0; transform: translateY(-2px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .status-dot.is-pulsing::after,
  .log-icon-wrap[data-state="running"] .log-icon,
  .activity-row.is-new { animation: none; } /* .is-new, not bare .activity-row — the
    entrance animation lives on the two-class selector, so the guard must match its
    specificity or `animation: none` here would lose the cascade to `.is-new`'s rule. */
  .inline-link, .sync-prompt, .status-dot, .status-sentence, .activity-row { transition: none; }
}
</style>
</head>
<body>
<main class="panel" id="fga-panel">
  <!-- Owner decree 2026-07-30: the internal masthead ("Figma Design Agent") is removed —
       it duplicated the Figma plugin window's own chrome title directly above it, and
       that OS/host-drawn title bar cannot be removed (verified against showUI docs). The
       sticky status block is now the panel's first visible row. -->
  <section class="status-hero fga-block" id="fga-status" aria-live="polite" aria-label="Connection status">
    <div class="status-row fga-row">
      <span class="status-dot" id="fga-dot" data-tone="muted"></span>
      <p class="status-sentence" id="fga-sentence" data-tone="muted">Not connected — your first command starts the broker.</p>
    </div>

    <!-- Onboarding: priority-1 content, not a debug affordance — re-parented here
         (block 1) so it answers the "disconnected, never connected" state directly.
         JS toggles [hidden] via showOnboarding (panel-model.ts). -->
    <section class="onboarding" id="fga-onboarding" aria-label="Getting started">
      <ul class="onboarding-list">
        <li>Bridges the figma-agent CLI to this file.</li>
        <li>Verify: <code>figma-agent status</code></li>
        <li>Keep this panel open.</li>
      </ul>
    </section>
  </section>

  <section class="context fga-block" id="fga-context" aria-label="File context">
    <h2 class="section-label">Context</h2>
    <dl class="detail-grid">
      <div class="detail-cell">
        <dt>File</dt>
        <dd id="fga-ctx-file">—</dd>
        <p class="detail-note" id="fga-ctx-file-note"></p>
      </div>
      <div class="detail-cell"><dt>Page</dt><dd id="fga-ctx-page">—</dd></div>
      <div class="detail-cell"><dt>Selection</dt><dd id="fga-ctx-selection">None</dd></div>
    </dl>
  </section>

  <section class="activity fga-block" id="fga-activity-block" aria-label="Activity log">
    <h2 class="section-label">Activity</h2>
    <ul class="activity-list" id="fga-activity" aria-live="polite">
      <li class="activity-empty">No activity yet</li>
    </ul>
  </section>

  <!-- Live-sync idle-commit prompt (spec 004 P4): one line, shown only at the idle
       point. "Sync now" applies the change-log via the deterministic kernel. -->
  <section class="sync-prompt" id="fga-sync" aria-live="polite" hidden>
    <p class="sync-msg" id="fga-sync-msg">changes ready</p>
    <div class="sync-actions">
      <button class="sync-btn" id="fga-sync-now" type="button">Sync now</button>
      <button class="inline-link" id="fga-sync-later" type="button">Later</button>
    </div>
  </section>

  <footer class="footer-row">
    <div class="identity-row">
      <span class="identity-dot"></span>
      <span id="fga-version">v0.1.0</span>
    </div>
  </footer>
</main>
<script>
"use strict";
(() => {
  // shared/protocol.ts
  var PROTOCOL_VERSION = 1;
  var PORT_RANGE_START = 9410;
  var PORT_RANGE_END = 9419;
  var CHUNK_LIMIT = 512 * 1024;
  var BROKER_IDLE_SHUTDOWN_MS = 30 * 6e4;
  var PLUGIN_HEARTBEAT_INTERVAL_MS = 1e4;
  var PLUGIN_PONG_TIMEOUT_MS = 25e3;
  var RECONNECT_BACKOFF_MIN_MS = 500;
  var RECONNECT_BACKOFF_MAX_MS = 8e3;
  var RECONNECT_JITTER = 0.25;
  function reduceConnState(current, event) {
    switch (event) {
      case "LOST":
        return "disconnected";
      case "PROBE":
        return "probing";
      case "FOUND":
        return current === "probing" ? "handshake" : current;
      case "READY":
        return current === "handshake" ? "connected" : current;
      default:
        return current;
    }
  }
  function makeStatePayload(state, extra = {}) {
    return {
      type: "CONN_STATE",
      state,
      since: extra.since ?? Date.now(),
      protocolVersion: PROTOCOL_VERSION,
      ...extra
    };
  }
